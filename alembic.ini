# Alembic 配置 — TeamHarness DB 派生索引层迁移
# 对应 SubTask 2.8 Alembic 迁移框架
#
# 数据库连接通过环境变量 DATABASE_SYNC_URL 注入（migrations/env.py 读取），
# 避免在配置文件中硬编码凭据。
#
# 使用方式：
#   set DATABASE_SYNC_URL=postgresql+psycopg://user:pwd@host/db
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# 时间戳模板（人类可读）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 默认连接（生产请用 DATABASE_SYNC_URL 环境变量覆盖）
sqlalchemy.url = sqlite:///./teamharness.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
