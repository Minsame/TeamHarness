# TeamHarness nginx 反向代理配置（SubTask 3.2）
#
# 路由规则：
#   /v1/webhook/git → asset-service（webhook 接收）
#   /v1/asset/*     → asset-service（PR Review / 语义去重）
#   /v1/recall/*    → recall-service
#   /v1/sync/*      → recall-service
#   /v1/llm/*       → distill-service（LLM 代理 + budget 查询）
#   /v1/system/*    → 轮询三服务（默认 asset-service）
#   /v1/metrics     → distill-service（指标上报）
#   其余 /v1/*      → asset-service（兜底）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;  # 资产 PR 单次提交上限

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    # 路径遍历检测：$request_uri 是原始未归一化的 URI，能捕获 .. 和 %2e%2e
    map $request_uri $is_path_traversal {
        default 0;
        ~*\.\. 1;
        ~*%2e%2e 1;
    }

    # 全局安全头（被各 location 继承）
    # X-Frame-Options 防点击劫持
    # X-Content-Type-Options nosniff 防 MIME 嗅探
    # X-XSS-Protection 防 XSS（旧浏览器）

    # 上游三服务
    upstream asset-service {
        server asset-service:8080;
    }
    upstream recall-service {
        server recall-service:8081;
    }
    upstream distill-service {
        server distill-service:8082;
    }

    server {
        listen 80;
        server_name _;

        # 全局安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 路径遍历防护：含 .. 的请求直接拒绝（用 map 变量避免 if 行为问题）
        if ($is_path_traversal) {
            return 400;
        }

        # 健康检查（nginx 自身）
        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # webhook 入口
        location = /v1/webhook/git {
            proxy_pass http://asset-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 召回服务
        location /v1/recall/ {
            proxy_pass http://recall-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v1/sync/ {
            proxy_pass http://recall-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 提炼服务（LLM 代理 + budget 查询）
        location /v1/llm/ {
            proxy_pass http://distill-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 指标上报
        location = /v1/metrics {
            proxy_pass http://distill-service;
            proxy_set_header Host $host;
        }

        # 系统信息（路由到 asset-service）
        location /v1/system/ {
            proxy_pass http://asset-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 兜底：其余 v1 端点走 asset-service（含 /v1/assets/* /v1/members/* /v1/auth/* /v1/binding/* /v1/governance/* /v1/metrics*）
        location /v1/ {
            proxy_pass http://asset-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端静态文件（Vue SPA）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # index.html 禁止缓存（确保前端更新即时生效）
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # JS 静态资源长缓存
        location ~* \.js$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
