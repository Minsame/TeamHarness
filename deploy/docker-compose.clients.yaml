# TeamHarness 虚拟团队客户端编排（SubTask: 虚拟团队测试）
#
# 用途：在 docker-compose 中模拟多个团队成员客户端，配合 docker-compose.yaml（服务端）
# 做并发冲突验证 / 端到端演示 / CI 回归 / 压力测试。
#
# 使用：
#   # 1. 先启动服务端（docker-compose.yaml）
#   docker compose -f deploy/docker-compose.yaml up -d
#
#   # 2. 启动虚拟团队（本文件）
#   docker compose -f deploy/docker-compose.clients.yaml --profile team-3 up -d
#
#   # 3. 初始化各成员（颁发 API Key + 克隆仓库）
#   docker compose -f deploy/docker-compose.clients.yaml --profile team-3 run init-team
#
#   # 4. 触发场景
#   docker compose -f deploy/docker-compose.clients.yaml --profile team-3 run scenario-concurrent
#
# Profile 说明：
#   team-3   → 3 人团队（alice / bob / charlie）— 默认，并发冲突 + 端到端演示
#   team-5   → 5 人团队（alice / bob / charlie / dave / eve）— 压力测试
#   ci       → CI 模式（3 人 + 场景自动运行 + 测试报告）
#
# 架构：
#   每个成员 = 独立容器（独立 working copy 卷 + 独立 API Key + 独立守护进程）
#   init-team = 一次性容器，调服务端 /v1/auth/apikey 颁发 Key + 注入各成员 env
#   scenario-* = 一次性容器，执行场景脚本

version: "3.9"

x-client-env: &client-env
  TEAMHARNESS_SERVER_URL: http://nginx:80
  TEAMHARNESS_REPO_ROOT: /home/teamharness/workspace
  TEAMHARNESS_CONFIG_DIR: /home/teamharness/.teamharness
  GIT_REPO_URL: http://teamharness:${GITEA_ADMIN_PASS:-teamharness-admin}@gitea:3000/teamharness/teamharness-shared.git
  GIT_REPO_BRANCH: main

x-client-base: &client-base
  build:
    context: ..
    dockerfile: deploy/client.Dockerfile
  image: teamharness/client:${TEAMHARNESS_VERSION:-1.0.0}
  restart: unless-stopped
  depends_on:
    init-team:
      condition: service_completed_successfully
  environment:
    <<: *client-env
  networks:
    - teamharness-net

services:
  # ---------------------------------------------------------------------------
  # 一次性初始化：调服务端 API 为每个成员颁发 API Key
  # ---------------------------------------------------------------------------
  init-team:
    image: teamharness/server:${TEAMHARNESS_VERSION:-1.0.0}
    container_name: teamharness-init-team
    user: root
    # nginx 定义在 docker-compose.yaml（服务端），跨文件 depends_on 不支持
    # 启动顺序由用户保证：先 docker compose -f docker-compose.yaml up -d，再启动本文件
    environment:
      TEAMHARNESS_SERVER_URL: http://nginx:80
      TEAM_MEMBERS: ${TEAM_MEMBERS:-alice,bob,charlie}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[init-team] 开始为成员颁发 API Key"
        mkdir -p /tmp/team-keys
        for member in $$(echo "$${TEAM_MEMBERS}" | tr ',' ' '); do
          echo "[init-team] 颁发 API Key: $${member}"
          # 调服务端 /v1/auth/apikey 颁发（agent_id 用 member 名作默认）
          resp=$$(curl -fsS -X POST "$${TEAMHARNESS_SERVER_URL}/v1/auth/apikey" \
            -H "Content-Type: application/json" \
            -d "{\"member_id\":\"$${member}\",\"agent_id\":\"agent-$${member}\"}" 2>/dev/null || echo '{}')
          api_key=$$(echo "$${resp}" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')
          agent_id=$$(echo "$${resp}" | sed -n 's/.*"agent_id":"\([^"]*\)".*/\1/p')
          if [ -z "$${api_key}" ]; then
            echo "[init-team] 警告: $${member} API Key 为空，服务端可能未实现该端点，使用占位 key"
            api_key="placeholder-$${member}"
          fi
          echo "$${api_key}" > "/tmp/team-keys/$${member}.key"
          echo "$${agent_id:-}" > "/tmp/team-keys/$${member}.agent"
          echo "[init-team] $${member}: api_key=$$(echo "$${api_key}" | cut -c1-8)... agent_id=$${agent_id}"
        done
        echo "[init-team] 颁发完成，写入共享卷"
        # 复制到共享卷供各成员读取（直接放 /keys/ 下，不放子目录）
        cp /tmp/team-keys/* /keys/
        echo "done" > /keys/.init-done
    volumes:
      - team-keys:/keys
    networks:
      - teamharness-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # 3 人团队（alice / bob / charlie）— 并发冲突 + 端到端演示
  # ---------------------------------------------------------------------------

  # --- alice ---
  client-alice:
    <<: *client-base
    container_name: teamharness-client-alice
    profiles: ["team-3", "team-5", "ci"]
    environment:
      <<: *client-env
      TEAMHARNESS_MEMBER_ID: alice
      TEAMHARNESS_PERSONAL_BRANCH: members/alice
    volumes:
      - alice-workspace:/home/teamharness/workspace
      - alice-config:/home/teamharness/.teamharness
      - team-keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 等待 init-team 完成
        while [ ! -f /keys/.init-done ]; do sleep 1; done
        # 读取 API Key
        export TEAMHARNESS_API_KEY=$$(cat /keys/alice.key)
        export TEAMHARNESS_AGENT_ID=$$(cat /keys/alice.agent 2>/dev/null || echo "")
        # 先 init 再 daemon
        client-entrypoint.sh init
        client-entrypoint.sh daemon

  # --- bob ---
  client-bob:
    <<: *client-base
    container_name: teamharness-client-bob
    profiles: ["team-3", "team-5", "ci"]
    environment:
      <<: *client-env
      TEAMHARNESS_MEMBER_ID: bob
      TEAMHARNESS_PERSONAL_BRANCH: members/bob
    volumes:
      - bob-workspace:/home/teamharness/workspace
      - bob-config:/home/teamharness/.teamharness
      - team-keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f /keys/.init-done ]; do sleep 1; done
        export TEAMHARNESS_API_KEY=$$(cat /keys/bob.key)
        export TEAMHARNESS_AGENT_ID=$$(cat /keys/bob.agent 2>/dev/null || echo "")
        client-entrypoint.sh init
        client-entrypoint.sh daemon

  # --- charlie ---
  client-charlie:
    <<: *client-base
    container_name: teamharness-client-charlie
    profiles: ["team-3", "team-5", "ci"]
    environment:
      <<: *client-env
      TEAMHARNESS_MEMBER_ID: charlie
      TEAMHARNESS_PERSONAL_BRANCH: members/charlie
    volumes:
      - charlie-workspace:/home/teamharness/workspace
      - charlie-config:/home/teamharness/.teamharness
      - team-keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f /keys/.init-done ]; do sleep 1; done
        export TEAMHARNESS_API_KEY=$$(cat /keys/charlie.key)
        export TEAMHARNESS_AGENT_ID=$$(cat /keys/charlie.agent 2>/dev/null || echo "")
        client-entrypoint.sh init
        client-entrypoint.sh daemon

  # ---------------------------------------------------------------------------
  # 5 人团队额外成员（dave / eve）— 压力测试
  # ---------------------------------------------------------------------------

  # --- dave ---
  client-dave:
    <<: *client-base
    container_name: teamharness-client-dave
    profiles: ["team-5"]
    environment:
      <<: *client-env
      TEAMHARNESS_MEMBER_ID: dave
      TEAMHARNESS_PERSONAL_BRANCH: members/dave
    volumes:
      - dave-workspace:/home/teamharness/workspace
      - dave-config:/home/teamharness/.teamharness
      - team-keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f /keys/.init-done ]; do sleep 1; done
        export TEAMHARNESS_API_KEY=$$(cat /keys/dave.key)
        export TEAMHARNESS_AGENT_ID=$$(cat /keys/dave.agent 2>/dev/null || echo "")
        client-entrypoint.sh init
        client-entrypoint.sh daemon

  # --- eve ---
  client-eve:
    <<: *client-base
    container_name: teamharness-client-eve
    profiles: ["team-5"]
    environment:
      <<: *client-env
      TEAMHARNESS_MEMBER_ID: eve
      TEAMHARNESS_PERSONAL_BRANCH: members/eve
    volumes:
      - eve-workspace:/home/teamharness/workspace
      - eve-config:/home/teamharness/.teamharness
      - team-keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f /keys/.init-done ]; do sleep 1; done
        export TEAMHARNESS_API_KEY=$$(cat /keys/eve.key)
        export TEAMHARNESS_AGENT_ID=$$(cat /keys/eve.agent 2>/dev/null || echo "")
        client-entrypoint.sh init
        client-entrypoint.sh daemon

  # ---------------------------------------------------------------------------
  # 场景脚本容器（一次性运行）
  # ---------------------------------------------------------------------------

  # 并发冲突场景：多成员同时 sync + 写同模块资产
  scenario-concurrent:
    image: teamharness/client:${TEAMHARNESS_VERSION:-1.0.0}
    container_name: teamharness-scenario-concurrent
    profiles: ["team-3", "team-5", "ci"]
    depends_on:
      client-alice:
        condition: service_started
      client-bob:
        condition: service_started
      client-charlie:
        condition: service_started
    environment:
      TEAMHARNESS_SERVER_URL: http://nginx:80
      TEAM_MEMBERS: ${TEAM_MEMBERS:-alice,bob,charlie}
    volumes:
      - team-keys:/keys:ro
      - ./virtual-team:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["bash /scripts/scenario-concurrent.sh"]
    networks:
      - teamharness-net
    restart: "no"

  # 端到端演示场景：完整流程（入库→同步→召回→提炼→发布）
  scenario-e2e:
    image: teamharness/client:${TEAMHARNESS_VERSION:-1.0.0}
    container_name: teamharness-scenario-e2e
    profiles: ["team-3", "ci"]
    depends_on:
      client-alice:
        condition: service_started
    environment:
      TEAMHARNESS_SERVER_URL: http://nginx:80
      TEAM_MEMBERS: ${TEAM_MEMBERS:-alice,bob,charlie}
    volumes:
      - team-keys:/keys:ro
      - ./virtual-team:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["bash /scripts/scenario-e2e.sh"]
    networks:
      - teamharness-net
    restart: "no"

  # 压力测试场景：高频 recall + metrics 上报
  scenario-stress:
    image: teamharness/client:${TEAMHARNESS_VERSION:-1.0.0}
    container_name: teamharness-scenario-stress
    profiles: ["team-5", "ci"]
    depends_on:
      client-alice:
        condition: service_started
    environment:
      TEAMHARNESS_SERVER_URL: http://nginx:80
      TEAM_MEMBERS: ${TEAM_MEMBERS:-alice,bob,charlie,dave,eve}
      STRESS_DURATION_SECONDS: ${STRESS_DURATION_SECONDS:-60}
      STRESS_QPS: ${STRESS_QPS:-5}
    volumes:
      - team-keys:/keys:ro
      - ./virtual-team:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["bash /scripts/scenario-stress.sh"]
    networks:
      - teamharness-net
    restart: "no"

volumes:
  team-keys:
  alice-workspace:
  alice-config:
  bob-workspace:
  bob-config:
  charlie-workspace:
  charlie-config:
  dave-workspace:
  dave-config:
  eve-workspace:
  eve-config:

networks:
  teamharness-net:
    external: true
    name: deploy_teamharness-net
